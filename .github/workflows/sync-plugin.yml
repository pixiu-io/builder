name: sync plugin command

on:
  push:
    branches-ignore:
      - master
    paths:
      - ".github/workflows/sync-plugin.yml"

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: sync plugin command
        run: go run ./cmd/builder sync plugin --configFile builder.yaml --os linux --upload --arch amd64 --github-owner ${{ secrets.OWNER }} --github-repo ${{ secrets.REPO }} --github-token ${{ secrets.TOKEN }}
