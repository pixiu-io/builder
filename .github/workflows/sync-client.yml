name: sync client command1

on:
  push:
    branches:
      - "caoyingjunz-patch-1"
    paths:
      - ".github/workflows/sync-client.yml"

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: sync client command
        run: go run ./cmd/builder sync-client --configFile builder.yaml --github-owner ${{ secrets.OWNER }} --github-repo ${{ secrets.REPO }} --github-token ${{ secrets.TOKEN }}
