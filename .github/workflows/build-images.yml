name: Build kubernetes images

on:
  push:
    branches-ignore:
      - master
    paths:
      - '.github/workflows/build-images.yml'

env:
  GO_VERSION: '1.25.0'
  KUBERNETES_VERSION: 'v1.37.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build and upload kubernetes images (${{ matrix.arch }})
        run: |
          go run ./cmd/builder \
            build images \
            --kubernetes-version "${{ env.KUBERNETES_VERSION }}" \
            --arch "${{ matrix.arch }}" \
            --upload \
            --github-tag kubernetes \
            --github-owner "${{ secrets.OWNER }}" \
            --github-repo "${{ secrets.REPO }}" \
            --github-token "${{ secrets.TOKEN }}"
