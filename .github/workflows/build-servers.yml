name: Build servers images

on:
  push:
    paths:
      - '.github/workflows/build-servers.yml'

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            config: builder.yaml
          - arch: arm64
            runner: ubuntu-24.04-arm
            config: builder-arm64.yaml
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build and upload servers images (${{ matrix.arch }})
        run: |
          go run ./cmd/builder \
            build servers \
            --arch "${{ matrix.arch }}" \
            --configFile "${{ matrix.config }}" \
            --upload \
            --github-tag download \
            --github-owner "${{ secrets.OWNER }}" \
            --github-repo "${{ secrets.REPO }}" \
            --github-token "${{ secrets.TOKEN }}" \
            --version v2
