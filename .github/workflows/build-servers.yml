name: Build servers images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（非空时产物为 pixiu-{version}-images-{arch}.tar.gz；为空则 pixiu-images-{arch}.tar.gz）"
        required: false
        type: string
        default: ""

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            config: builder.yaml
          - arch: arm64
            runner: ubuntu-24.04-arm
            config: builder-arm64.yaml
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build and upload servers images (${{ matrix.arch }})
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ARGS=(
            build servers
            --arch "${{ matrix.arch }}"
            --configFile "${{ matrix.config }}"
            --upload
            --github-tag servers
            --github-owner "${{ secrets.OWNER }}"
            --github-repo "${{ secrets.REPO }}"
            --github-token "${{ secrets.TOKEN }}"
          )
          if [ -n "${VERSION}" ]; then
            ARGS+=(--version "${VERSION}")
          fi
          go run ./cmd/builder "${ARGS[@]}"
