# builder 配置文件（位于仓库根目录 builder.yaml）
# 单文件包含五节：build 默认参数、OS 注册表（oses）、k8s 版本参考（versions）、
# 附加组件镜像（addon_images）、附加安装包（addon_packages）。
# 生产默认路径 /etc/pixiu/builder.yaml；本地开发：--configFile ./builder.yaml 或 BUILDER_CONFIG_FILE=./builder.yaml

# ========== build 默认参数（优先级：命令行 > 配置文件 > 内置默认值）==========
# 本节点即 build 子命令的「命令行配置」：每个 key 对应一个命令行 flag。
#   命令行显式传参优先；未传时回落本配置节；配置值为空（或未配置）时使用 flag 内置默认值。
# 字符串 key 留空 "" 表示不覆盖内置默认；布尔 key（skip_* / only_addons / dry_run）默认 false。
# 核心软件包/镜像始终使用默认清单（BuildPackageList / kubeadm 生成），不再提供覆盖/追加参数；
# 自定义能力完全由顶层 addon_packages / addon_images + --mode + --only-addons / --skip-addons 提供。
build:
  os: ""                    # 对应 --os：目标系统（如 ubuntu）
  os_version: ""            # 对应 --os-version：系统版本（如 22.04）
  kubernetes_version: ""    # 对应 --kubernetes-version：k8s 版本（如 v1.31.1）
  arch: "amd64"             # 对应 --arch：目标架构（amd64/arm64）
  mirror: "aliyun"         # 对应 --mirror：镜像源（official/aliyun/tencent，默认阿里云 registry.aliyuncs.com/google_containers）
  workdir: "./work"         # 对应 --workdir：工作目录（bundle 构建于此）
  out: "./dist"             # 对应 --out：产物输出目录（tar.gz 输出到此）
  mode: "all"               # 对应 --mode：构建模式（all=两者 / packages=仅软件包 / images=仅镜像；镜像阶段由 --mode packages 跳过）
  skip_addons: false        # 对应 --skip-addons：跳过附加组件（addon_images 与 addon_packages 均不并入）
  only_addons: false        # 对应 --only-addons：只打包附加（核心软件包/镜像全去）
  dry_run: false            # 对应 --dry-run：仅演练管线，不真实下载/拉取
  keep_files: false         # 对应 --keep-files：默认 false=构建完成后清理中间文件与 docker 中间镜像；true=保留
  verbose: false            # 对应 --verbose/-v：默认 false=精简输出；true=打印详细过程日志（镜像下载/pull 进度等）
  kubeadm_dir: "./kube"      # 对应 --kubeadm-dir：kubeadm 二进制缓存目录，文件名 kubeadm-{version}-linux-{arch}


# ========== OS 注册表 ==========
# 定义各 OS 的可用版本、包管理器、构建镜像（容器内下载软件包用）、
# 架构，以及软件源所需的版本代号（codename / codenames）与 rpm 发行版标识（rpm_distro）。
# pkg_manager 支持 apt / dnf / yum；留空时按 OS+版本自动推导（如 centos 7 → yum、centos 8/9 → dnf、ubuntu → apt）。
# 提示：versions/build_images 为参考初始值；build 支持任意 OS/版本（未登记时构建镜像默认为 {name}:{version}）。
# 包源说明：
#   - apt 系 k8s 组件（kubeadm/kubelet/kubectl）来自阿里云 kubernetes-new，仓库由 k8s 版本自动推导（v1.27.3 → v1.27）
#   - containerd.io 来自 docker-ce 源，默认阿里云镜像 mirrors.aliyun.com/docker-ce（containerd_repo=aliyun），
#     本项目 ubuntu 配置为中科大 mirrors.ustc.edu.cn/docker-ce（containerd_repo=ustc）；官方 download.docker.com 可选（containerd_repo=docker）；
#     apt 源需要 codename，dnf 源需要 rpm_distro（rocky→rhel9、openEuler→rhel7，国内镜像路径段为 centos/{大版本}、centos/gpg）
#   - 原 packages.containerd.io 域名 NXDOMAIN 不可达，已改用 docker-ce 源（默认阿里云镜像）；
#     openEuler 对应 rhel/7 在官方 download.docker.com 为 404（docker 官方已停止发布 RHEL7 仓库），
#     因此 openEuler 配置 containerd_pkg: containerd + containerd_repo: none，从系统源（everything 仓库）安装 containerd，
#     不再配置 docker-ce 源；其他 dnf 系（rocky 等）默认 containerd.io + 阿里云镜像（containerd_repo=aliyun）
oses:
  - name: ubuntu
    versions: ["20.04", "22.04", "24.04"]
    pkg_manager: apt
    build_images:
      "20.04": swr.cn-north-4.myhuaweicloud.com/pixiu-public/ubuntu:20.04
      "22.04": swr.cn-north-4.myhuaweicloud.com/pixiu-public/ubuntu:22.04
      "24.04": swr.cn-north-4.myhuaweicloud.com/pixiu-public/ubuntu:24.04
    codenames:
      "20.04": focal
      "22.04": jammy
      "24.04": noble
    containerd_repo: ustc    # 中科大镜像 mirrors.ustc.edu.cn/docker-ce（默认 aliyun，可配置 ustc/docker/none）
    archs: ["amd64", "arm64"]
  - name: debian
    versions: ["11", "12"]
    pkg_manager: apt
    build_images:
      "11": swr.cn-north-4.myhuaweicloud.com/pixiu-public/debian:11
      "12": swr.cn-north-4.myhuaweicloud.com/pixiu-public/debian:12
    codenames:
      "11": bullseye
      "12": bookworm
    archs: ["amd64", "arm64"]
  - name: rocky
    versions: ["9"]
    pkg_manager: dnf
    build_images:
      "9": swr.cn-north-4.myhuaweicloud.com/pixiu-public/rockylinux:9
    rpm_distro: rhel9
    archs: ["amd64", "arm64"]
  - name: openEuler
    versions: ["22.03"]
    pkg_manager: dnf
    build_images:
      "22.03": swr.cn-north-4.myhuaweicloud.com/pixiu-public/openeuler:22.03-lts-sp3
    rpm_distro: rhel7
    # openEuler 对应 download.docker.com/linux/rhel/7/ 为 404（docker 官方已停止发布 RHEL7 仓库），
    # 因此 containerd 改为从系统源（everything 仓库，含 containerd-1.2.0-315.oe2203sp3）安装：
    #   containerd_pkg: "containerd"（系统源包名，非 docker-ce 源的 containerd.io）
    #   containerd_repo: "none"（不配置 download.docker.com 源，避免 dnf makecache 失败）
    containerd_pkg: "containerd"
    containerd_repo: "none"
    archs: ["amd64", "arm64"]

# ========== k8s 版本（可选参考）==========
# k8s 版本参考清单（可选）。
# build 支持任意合法 vX.Y.Z 版本（如 v1.29.5、v1.30.2），无需在此注册；
# 本清单仅用于：
#   1) list-k8s 展示常见参考版本；
#   2) 已知版本的 crictl 回退版本覆盖（cri-tools 包缺失时使用清单中的 crictl 值）。
# apt 包源仓库由 version 自动推导（v1.27.3 → 阿里云 kubernetes-new v1.27），无需额外字段。
# containerd / runc 以包管理器源内软件包为准（此处的版本字段仅供记录参考）；
# 未注册版本的 crictl 回退版本自动推导为与 k8s 版本对齐（v1.29.5 → 1.29.5）。
versions:
  - version: v1.27.3
    containerd: "1.7.13"
    crictl: "1.27.1"
    runc: "1.1.7"
  - version: v1.28.2
    containerd: "1.7.13"
    crictl: "1.28.0"
    runc: "1.1.7"
  - version: v1.31.0
    containerd: "1.7.13"
    crictl: "1.31.0"
    runc: "1.1.7"

# ========== 附加组件镜像 ==========
# 附加组件镜像清单：name → image:tag（仅镜像，不含软件包；附加安装包见下方 addon_packages 节）。
# name 用作镜像保存文件名（images/addons/{name}.tar）。
# CNI 附加组件镜像：flannel（默认 CNI，华为云 SWR pixiu-public 仓库）与 calico（v3.31.3，pixiucloud 仓库）。
# 仓库不可达时可用 build --skip-addons 跳过附加组件。
addon_images:
  - name: flannel
    image: "ccr.ccs.tencentyun.com/pixiucloud/flannel"
    tag: "v0.25.4"
  - name: flannel-cni-plugin
    image: "ccr.ccs.tencentyun.com/pixiucloud/flannel-cni-plugin"
    tag: "v1.4.1-flannel1"
  # ---- kubez-ansible CNI：calico（enable_calico=yes，v3.31.3，仓库 ccr.ccs.tencentyun.com/pixiucloud）----
  - name: calico-cni
    image: "ccr.ccs.tencentyun.com/pixiucloud/cni"
    tag: "v3.31.3"
  - name: calico-node
    image: "ccr.ccs.tencentyun.com/pixiucloud/node"
    tag: "v3.31.3"
  - name: calico-kube-controllers
    image: "ccr.ccs.tencentyun.com/pixiucloud/kube-controllers"
    tag: "v3.31.3"
  - name: calico-typha
    image: "ccr.ccs.tencentyun.com/pixiucloud/typha"
    tag: "v3.31.3"
  # ---- kubez-ansible metrics：metrics-server 与 dashboard metrics-scraper（仓库 ccr.ccs.tencentyun.com/pixiucloud）----
  - name: metrics-server
    image: "ccr.ccs.tencentyun.com/pixiucloud/metrics-server"
    tag: "v0.6.4"
  - name: metrics-scraper
    image: "ccr.ccs.tencentyun.com/pixiucloud/metrics-scraper"
    tag: "v1.0.8"
  - name: metrics-scraper-nginx
    image: "ccr.ccs.tencentyun.com/pixiucloud/nginx"
    tag: "1.25-pixiu"


# ========== 附加安装包 ==========
# 附加安装包列表（与 addon_images 平级），mode ∈ {packages, all} 且未 --skip-addons 时
# 并入软件包下载清单（与核心清单按包名去重合并）；--only-addons 时为其软件包主体。
# 这些是部署附加组件（或其它宿主组件）需要的系统软件包（apt/dnf 通用名）。
# 每项为 {name, version} 对象：
#   - name：包名（须与目标系统源匹配）
#   - version：可选锁定版本；为空（或省略）= 不锁版本，透传纯包名给容器内包管理器；
#     非空按目标包管理器语法转译：apt 系 name=version（如 vim=9.0）、dnf/yum 系 name-version（如 vim-9.0）。
#     版本需与目标系统源匹配，不匹配时由容器内包管理器报错，请自行调整。
addon_packages:
  - name: conntrack
  - name: vim
  - name: docker-ce

# 产物上传到 GitHub Release。build --upload / upload 使用。
# token 建议用环境变量 GITHUB_TOKEN 或 GH_TOKEN（也可配置 github.token / --github-token）。
# tag 为空时，build --upload 默认使用 --kubernetes-version。
# 对应 Release 必须已存在；上传不会自动创建 Release。
github:
  owner: ""                   # 仓库所有者（或通过 --github-owner 覆盖）
  repo: ""                    # 仓库名（或通过 --github-repo 覆盖）
  tag: ""                     # Release tag，如 v1.27.3（或通过 --github-tag 覆盖）
  token: ""                   # GitHub PAT（建议用环境变量 GITHUB_TOKEN / GH_TOKEN，勿明文写入）
